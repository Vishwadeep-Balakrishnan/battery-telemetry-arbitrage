# Mosquitto config for this project.
# Docker: mounted into the eclipse-mosquitto container by docker-compose.yml.
# Pi:     sudo cp deploy/mosquitto/mosquitto.conf /etc/mosquitto/conf.d/battery.conf
#         sudo systemctl restart mosquitto
#
# Listens on all interfaces so a telemetry program on the Pi can reach a broker
# on your laptop (or the other way round). Anonymous access is fine on a home
# LAN; add a password_file before exposing this anywhere else.

listener 1883 0.0.0.0
allow_anonymous true
