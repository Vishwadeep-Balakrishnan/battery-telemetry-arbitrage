[pytest]
# Run from the repo root:  pytest
# backend/ is on the path so tests can `import app`; the root lets them `import arbitrage`.
pythonpath = backend .
testpaths = backend/tests arbitrage/tests
addopts = --import-mode=importlib
# Deprecation noise from inside third-party packages, not from this repo.
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:matplotlib.*
