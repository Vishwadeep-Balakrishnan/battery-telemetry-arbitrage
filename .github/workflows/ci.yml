name: CI

on:
  push:
  pull_request:

jobs:
  cpp:
    name: C/C++ build + GoogleTest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libmosquitto-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build (library, telemetry program, tests)
        run: cmake --build build -j
      - name: Run GoogleTest
        run: ctest --test-dir build --output-on-failure
      - name: Mock sensor smoke test
        run: ./build/libina219/ina219_read mock

  python:
    name: Python tests (backend + arbitrage)
    runs-on: ubuntu-24.04
    env:
      PJM_API_KEY: ""   # CI never calls the live PJM API; tests also block the network
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            arbitrage/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r arbitrage/requirements.txt -r requirements-dev.txt
      - name: Run pytest
        run: pytest -v

  dashboard:
    name: Dashboard type check + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
