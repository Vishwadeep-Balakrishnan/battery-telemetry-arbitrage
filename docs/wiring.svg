<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Battery telemetry wiring</title>
  <desc>18650 cell charged by a TP4056 module; INA219 high-side in series between TP4056 OUT+ and the load; Raspberry Pi reads the INA219 over I2C.</desc>
  <style>
    .box { fill: #ffffff; stroke: #333; stroke-width: 2; }
    .label { font-weight: bold; }
    .pin { font-size: 12px; fill: #333; }
    .pos { stroke: #d62828; stroke-width: 3; fill: none; }
    .neg { stroke: #222; stroke-width: 3; fill: none; }
    .sda { stroke: #2a78d6; stroke-width: 3; fill: none; }
    .scl { stroke: #e6a100; stroke-width: 3; fill: none; }
    .v33 { stroke: #e76f51; stroke-width: 3; fill: none; stroke-dasharray: 8 4; }
    .note { font-size: 12px; fill: #555; }
  </style>
  <rect width="960" height="560" fill="#fafaf8"/>

  <!-- 18650 cell -->
  <rect class="box" x="40" y="80" width="120" height="70" rx="8"/>
  <text class="label" x="100" y="110" text-anchor="middle">18650 cell</text>
  <text class="note" x="100" y="130" text-anchor="middle">protected, 3.0–4.2 V</text>
  <text class="pin" x="150" y="98" text-anchor="end">+</text>
  <text class="pin" x="150" y="142" text-anchor="end">−</text>

  <!-- TP4056 -->
  <rect class="box" x="240" y="60" width="160" height="130" rx="8"/>
  <text class="label" x="320" y="88" text-anchor="middle">TP4056</text>
  <text class="note" x="320" y="105" text-anchor="middle">charger + protection</text>
  <text class="pin" x="248" y="128">B+</text>
  <text class="pin" x="248" y="176">B−</text>
  <text class="pin" x="392" y="128" text-anchor="end">OUT+</text>
  <text class="pin" x="392" y="176" text-anchor="end">OUT−</text>
  <text class="note" x="320" y="215" text-anchor="middle">USB-C in (charging)</text>

  <!-- INA219 -->
  <rect class="box" x="480" y="60" width="180" height="200" rx="8"/>
  <text class="label" x="570" y="88" text-anchor="middle">INA219 (0x40)</text>
  <text class="note" x="570" y="105" text-anchor="middle">0.1 Ω shunt, high side</text>
  <text class="pin" x="488" y="128">VIN+</text>
  <text class="pin" x="652" y="128" text-anchor="end">VIN−</text>
  <text class="pin" x="488" y="176">GND</text>
  <text class="pin" x="652" y="248" text-anchor="end">VCC</text>
  <text class="pin" x="652" y="224" text-anchor="end">SDA</text>
  <text class="pin" x="652" y="200" text-anchor="end">SCL</text>

  <!-- Switch and load -->
  <circle cx="740" cy="124" r="5" fill="#333"/>
  <circle cx="790" cy="124" r="5" fill="#333"/>
  <line x1="740" y1="124" x2="785" y2="104" stroke="#333" stroke-width="3"/>
  <text class="note" x="765" y="95" text-anchor="middle">toggle switch</text>
  <rect class="box" x="840" y="110" width="80" height="80" rx="6"/>
  <text class="label" x="880" y="146" text-anchor="middle">Load</text>
  <text class="note" x="880" y="165" text-anchor="middle">10 Ω 5 W</text>

  <!-- Raspberry Pi -->
  <rect class="box" x="240" y="330" width="260" height="190" rx="10"/>
  <text class="label" x="370" y="358" text-anchor="middle">Raspberry Pi (GPIO header)</text>
  <text class="pin" x="490" y="392" text-anchor="end">pin 1 · 3.3V</text>
  <text class="pin" x="490" y="420" text-anchor="end">pin 3 · GPIO2 / SDA</text>
  <text class="pin" x="490" y="448" text-anchor="end">pin 5 · GPIO3 / SCL</text>
  <text class="pin" x="490" y="476" text-anchor="end">pin 6 · GND</text>
  <text class="note" x="370" y="505" text-anchor="middle">powered by its own USB supply, not the cell</text>

  <!-- Power path (red = +, black = −) -->
  <path class="pos" d="M160 94 H200 V124 H240"/>
  <path class="neg" d="M160 138 H200 V172 H240"/>
  <path class="pos" d="M400 124 H480"/>
  <path class="pos" d="M660 124 H740"/>
  <path class="pos" d="M790 124 H840"/>
  <path class="neg" d="M880 190 V290 H420 V172 H400"/>
  <!-- common ground: INA219 GND and Pi GND to OUT− -->
  <path class="neg" d="M480 172 H450 V290"/>
  <path class="neg" d="M500 472 H560 V290"/>
  <circle cx="450" cy="290" r="5" fill="#222"/>
  <circle cx="560" cy="290" r="5" fill="#222"/>
  <text class="note" x="740" y="284">common ground (OUT−)</text>

  <!-- I2C and logic power -->
  <path class="v33" d="M500 388 H680 V244 H660"/>
  <path class="sda" d="M500 416 H700 V220 H660"/>
  <path class="scl" d="M500 444 H720 V196 H660"/>

  <!-- Legend -->
  <g transform="translate(738,380)">
    <rect x="0" y="0" width="212" height="130" rx="6" fill="#fff" stroke="#ccc"/>
    <line x1="14" y1="24" x2="54" y2="24" class="pos"/><text class="pin" x="64" y="28">battery + / load current</text>
    <line x1="14" y1="48" x2="54" y2="48" class="neg"/><text class="pin" x="64" y="52">ground / return</text>
    <line x1="14" y1="72" x2="54" y2="72" class="v33"/><text class="pin" x="64" y="76">3.3 V logic supply</text>
    <line x1="14" y1="96" x2="54" y2="96" class="sda"/><text class="pin" x="64" y="100">I2C SDA</text>
    <line x1="14" y1="120" x2="54" y2="120" class="scl"/><text class="pin" x="64" y="124">I2C SCL</text>
  </g>
</svg>
